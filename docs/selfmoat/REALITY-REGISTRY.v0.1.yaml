schema_id: OURSELF-SELFMOAT-REALITY-REGISTRY
schema_version: 0.1.0
registry_status: INITIAL_DRAFT
constitutional_owner: OSOS
created_at: 2026-11-10
governance:
  invariants:
    - DESIGNED != DEPLOYED != OPERATIONAL != INDEPENDENTLY_VERIFIED
    - DECLARATION != AUTHORITY
    - PROPOSAL != ADMISSION
    - ADMISSION != ACTUATION
    - RECEIPT != EFFECT
    - No authority, no effect.
  admission_rule: A reality is not independently established by a repository, device, integration, or declaration alone.
  evidence_rule: Every capability claim must reference an inspectable artifact and a reproducible verification procedure.
  mutation_boundary: This registry is a draft on an isolated branch; no default-branch mutation or runtime actuation is authorized by this commit.

required_fields:
  - reality_id
  - reality_name
  - moat_class
  - root_identity
  - infrastructure
  - capabilities
  - authority_boundary
  - evidence_refs
  - operational_status
  - verification_state
  - dependency_graph
  - known_gaps
  - last_verified_at

status_vocabulary:
  operational_status: [DESIGNED, DEPLOYED, PARTIAL, LIVE, BLOCKED]
  verification_state: [UNVERIFIED, SOURCE_VERIFIED, TEST_VERIFIED, RUNTIME_VERIFIED, INDEPENDENTLY_VERIFIED]


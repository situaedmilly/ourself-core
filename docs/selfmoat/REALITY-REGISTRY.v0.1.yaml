initialization_notes:
  - Records are provisional inventory entries derived from the supplied November 10 ecosystem synthesis; they are not a fresh source/runtime audit.
  - Repository URLs are discovery pointers, not proof of implementation or operation.
  - Reported device specifications and health-check findings require attached source receipts before status promotion.
  - A future revision must attach immutable evidence identifiers, hashes, test commands, observed outputs, verifier identity, and verification timestamps.


name: REVERSELF repository-owned PostgreSQL vertical slice

on:
  workflow_dispatch:
  push:
    branches:
      - "reality/reverself-live-postgres-v0.1"
    paths:
      - "db/**"
      - "packages/crop-order-proof/**"
      - "scripts/reverself-live-postgres.mjs"
      - ".github/workflows/reverself-live-postgres.yml"
      - "compose.yml"

permissions:
  contents: read

jobs:
  live-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ourself
          POSTGRES_PASSWORD: ourself
          POSTGRES_DB: ourself
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ourself -d ourself"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ourself:ourself@localhost:5432/ourself
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Initialize ephemeral Node workspace
        run: npm init -y
      - name: Install PostgreSQL client library
        run: npm install --no-save pg
      - name: Apply repository-owned PostgreSQL migration
        run: |
          PGPASSWORD=ourself psql -h localhost -U ourself -d ourself \
            -v ON_ERROR_STOP=1 -f db/migrations/001_matter_messaging.sql
      - name: Execute REVERSELF vertical slice
        run: node scripts/reverself-live-postgres.mjs | tee governed-messaging-receipt.json
      - name: Validate machine receipt
        run: |
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("governed-messaging-receipt.json","utf8")); if(r.result!=="PASSED") process.exit(1);'
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: reverself-repository-owned-postgres-receipt
          path: governed-messaging-receipt.json

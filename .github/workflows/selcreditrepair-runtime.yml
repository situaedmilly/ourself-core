name: SELFCREDITREPAIR Runtime Primitive

on:
  push:
    branches:
      - selcreditrepair-runtime-primitive-v1
  workflow_dispatch:

jobs:
  constitutional-runtime:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute constitutional runtime vectors
        run: npm test --prefix selcreditrepair

name: REVERSELF database persistence witness

on:
  push:
    branches:
      - reality/reverself-live-postgres-v0.1
  workflow_dispatch:

jobs:
  persistence-witness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute persistence witness
        run: bash scripts/reverself-persistence-witness.sh

      - name: Upload persistence receipt
        uses: actions/upload-artifact@v4
        with:
          name: reverself-persistence-witness
          path: proof/reverself-persistence-witness.json

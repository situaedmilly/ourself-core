name: Tunnel 2 — Agent Runtime

on:
  push:
    branches: [tunnel-2-agent-runtime-v0.1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tunnel-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute bounded Tunnel 2 runtime
        run: node --test ourselfd/tunnel2-agent-runtime.test.mjs
